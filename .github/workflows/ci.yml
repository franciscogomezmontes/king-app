name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rules-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rules engine tests (must pass before anything else)
        run: pnpm --filter rules-engine test
      - name: AI opponent tests
        run: pnpm --filter ai-opponent test
      - name: Server tests
        run: pnpm --filter server test
